name: Build Android Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Android NDK r26b
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          link-to-sdk: true

      - name: Generate release keystore and write key.properties
        run: |
          mkdir -p android/app
          KEYSTORE_PATH="$GITHUB_WORKSPACE/android/app/release.jks"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_PATH" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias privatelm \
            -dname "CN=PrivateLM, OU=Mobile, O=PrivateLM, L=Unknown, S=Unknown, C=US" \
            -storepass privatelm_release_pass \
            -keypass privatelm_release_pass

          cat <<EOF > android/key.properties
          storeFile=$KEYSTORE_PATH
          storePassword=privatelm_release_pass
          keyAlias=privatelm
          keyPassword=privatelm_release_pass
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Install Vulkan Shader Compiler (glslc)
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc || sudo apt-get install -y shaderc

      - name: Build APK (Release, split-per-abi)
        run: flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: Upload arm64-v8a APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 7
